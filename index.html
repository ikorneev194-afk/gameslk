<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CITY RUSH 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a23; z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #ff00ff; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 140, 0, 0.15);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        
        h1 {
            font-size: 4rem; font-weight: 900; color: #fff; text-transform: uppercase;
            letter-spacing: 4px; text-shadow: 0 0 20px rgba(255,140,0,0.8), 0 0 40px rgba(255,0,255,0.4);
            margin-bottom: 10px; text-align: center;
        }
        .subtitle {
            font-size: 1.2rem; color: rgba(255,255,255,0.9); margin-bottom: 30px;
            animation: blink 1.5s infinite; text-align: center; padding: 0 20px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .theme-selector {
            display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center;
        }
        .theme-btn {
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            color: white; padding: 12px 24px; border-radius: 12px; cursor: pointer;
            font-weight: 700; font-size: 0.9rem; transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .theme-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .theme-btn.active { 
            background: rgba(255,140,0,0.3); border-color: #ff8c00; 
            box-shadow: 0 0 15px rgba(255,140,0,0.4);
        }
        
        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            opacity: 0; transition: opacity 0.3s;
        }
        #hud.active { opacity: 1; }
        .hud-panel {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
            padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2);
            color: white; font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .coin-icon {
            display: inline-block; width: 20px; height: 20px; background: #ffd700;
            border-radius: 50%; margin-right: 8px; vertical-align: middle;
            box-shadow: 0 0 10px #ffd700; border: 2px solid #ffaa00;
        }
        
        .stat-value { color: #ff8c00; font-size: 1.3rem; }
        
        #final-score { font-size: 2rem; color: #fff; margin-bottom: 20px; font-weight: 700; }
        
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .hud-panel { padding: 8px 12px; font-size: 0.9rem; }
            .theme-btn { padding: 10px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <div>ЗАГРУЗКА МИРА...</div>
</div>

<div id="canvas-container"></div>

<div class="ui-layer">
    <div id="hud">
        <div class="hud-panel">SCORE: <span class="stat-value" id="score-val">0</span></div>
        <div class="hud-panel"><span class="coin-icon"></span><span class="stat-value" id="coin-val">0</span></div>
        <div class="hud-panel"><span class="stat-value" id="speed-val">0</span> km/h</div>
    </div>

    <div id="start-screen" class="overlay interactive active">
        <h1>CITY RUSH</h1>
        <div class="theme-selector">
            <button class="theme-btn active" data-theme="tokyo">Неоновый Токио</button>
            <button class="theme-btn" data-theme="ruins">Древние Руины</button>
            <button class="theme-btn" data-theme="space">Космостанция</button>
        </div>
        <div class="subtitle">Нажми ПРОБЕЛ или тапни для старта</div>
    </div>

    <div id="game-over-screen" class="overlay interactive">
        <h1>GAME OVER</h1>
        <div id="final-score">Счет: 0</div>
        <div class="subtitle">Нажми ПРОБЕЛ или тапни для рестарта</div>
    </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const THEMES = {
    tokyo: {
        name: "Неоновый Токио", bg: 0x0a0a23, fog: 0x0a0a23, road: 0x1a1a1a,
        marking: 0xff00ff, building: 0x2a1a3a, emissive: 0x00ffff,
        obstacle: 0xff3333, coin: 0xaa00ff, particle: 0xff00ff,
        light: 0x4444ff, ambient: 0x222244, groundRoughness: 0.1
    },
    ruins: {
        name: "Древние Руины", bg: 0x2d4a22, fog: 0x2d4a22, road: 0x5c4d3c,
        marking: 0x4caf50, building: 0x4a3c2a, emissive: 0xff9800,
        obstacle: 0x3e2723, coin: 0xffd700, particle: 0x8d6e63,
        light: 0xffaa00, ambient: 0x445544, groundRoughness: 0.8
    },
    space: {
        name: "Космостанция", bg: 0x050510, fog: 0x050510, road: 0x2c3e50,
        marking: 0x00e5ff, building: 0x1a233a, emissive: 0x00e5ff,
        obstacle: 0xd50000, coin: 0x00e5ff, particle: 0x00e5ff,
        light: 0xaaccff, ambient: 0x223344, groundRoughness: 0.4
    }
};

const state = {
    isPlaying: false,
    isGameOver: false,
    score: 0,
    coins: 0,
    speed: 0.2,
    maxSpeed: 0.6,
    lane: 0, // -1, 0, 1
    targetX: 0,
    velocityY: 0,
    isJumping: false,
    playerBaseY: 0,
    theme: 'tokyo',
    segments: [],
    particles: [],
    lastSegmentZ: 0,
    distance: 0
};

let scene, camera, renderer, player, mixer, action;
let clock = new THREE.Clock();
const laneWidth = 3.5;
const segmentLength = 20;
const numSegments = 12;

function init() {
    const container = document.getElementById('canvas-container');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(THEMES[state.theme].bg);
    scene.fog = new THREE.Fog(THEMES[state.theme].fog, 15, 80);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 5, 8);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    setupLights();
    setupPlayer();
    setupInputs();
    
    window.addEventListener('resize', onWindowResize);
    
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            state.theme = e.target.dataset.theme;
            applyTheme();
            if (state.isPlaying || state.isGameOver) resetGame();
        });
    });

    setTimeout(() => {
        document.getElementById('loading-screen').style.opacity = 0;
        setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
    }, 1000);

    animate();
}

function setupLights() {
    const theme = THEMES[state.theme];
    scene.children = scene.children.filter(c => c.isLight);
    
    const hemiLight = new THREE.HemisphereLight(theme.ambient, 0x080820, 0.6);
    scene.add(hemiLight);
    
    const dirLight = new THREE.DirectionalLight(theme.light, 1.2);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 50;
    dirLight.shadow.camera.left = -20;
    dirLight.shadow.camera.right = 20;
    dirLight.shadow.camera.top = 20;
    dirLight.shadow.camera.bottom = -20;
    scene.add(dirLight);
    
    const ambient = new THREE.AmbientLight(theme.ambient, 0.4);
    scene.add(ambient);
}

function applyTheme() {
    const theme = THEMES[state.theme];
    scene.background = new THREE.Color(theme.bg);
    scene.fog = new THREE.Fog(theme.fog, 15, 80);
    setupLights();
    
    state.segments.forEach(seg => {
        seg.road.material.color.setHex(theme.road);
        seg.markings.forEach(m => m.material.color.setHex(theme.marking));
        seg.buildings.forEach(b => {
            b.mesh.material.color.setHex(theme.building);
            if(b.sign) b.sign.material.color.setHex(theme.emissive);
        });
        seg.obstacles.forEach(o => o.mesh.material.color.setHex(theme.obstacle));
        seg.coins.forEach(c => {
            c.mesh.material.color.setHex(theme.coin);
            c.mesh.material.emissive.setHex(theme.coin);
        });
    });
}

function setupPlayer() {
    const loader = new GLTFLoader();
    loader.load('player_game.glb', 
        (gltf) => {
            player = gltf.scene;
            player.traverse(c => {
                if (c.isMesh) {
                    c.castShadow = true;
                    c.receiveShadow = true;
                }
            });
            
            const box = new THREE.Box3().setFromObject(player);
            const size = new THREE.Vector3();
            box.getSize(size);
            const scale = 2.0 / size.y;
            player.scale.setScalar(scale);
            
            box.setFromObject(player);
            const shiftY = -box.min.y;
            player.position.y += shiftY;
            state.playerBaseY = player.position.y;
            
            player.rotation.y = Math.PI;
            
            scene.add(player);
            
            mixer = new THREE.AnimationMixer(player);
            const clip = gltf.animations.find(a => a.name.toLowerCase().includes('run') || a.name.toLowerCase().includes('walk'));
            if (clip) {
                action = mixer.clipAction(clip);
                action.play();
            }
            
            document.getElementById('loading-screen').style.display = 'none';
        },
        undefined,
        (error) => {
            console.warn('GLTF load failed, using fallback', error);
            const geometry = new THREE.CapsuleGeometry(0.5, 1.0, 4, 8);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00ff88, roughness: 0.3, metalness: 0.7 
            });
            player = new THREE.Mesh(geometry, material);
            player.position.y = 1.0;
            player.castShadow = true;
            player.receiveShadow = true;
            state.playerBaseY = 0.0;
            scene.add(player);
            document.getElementById('loading-screen').style.display = 'none';
        }
    );
}

function createSegment(zPos) {
    const theme = THEMES[state.theme];
    const group = new THREE.Group();
    group.position.z = zPos;
    
    const roadGeo = new THREE.PlaneGeometry(12, segmentLength);
    const roadMat = new THREE.MeshStandardMaterial({ 
        color: theme.road, roughness: theme.groundRoughness, metalness: 0.2 
    });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    group.add(road);
    
    const markings = [];
    for (let i = -1; i <= 1; i += 2) {
        for (let j = -segmentLength/2; j < segmentLength/2; j += 2) {
            const markGeo = new THREE.PlaneGeometry(0.2, 1);
            const markMat = new THREE.MeshStandardMaterial({ 
                color: theme.marking, emissive: theme.marking, emissiveIntensity: 2 
            });
            const mark = new THREE.Mesh(markGeo, markMat);
            mark.rotation.x = -Math.PI / 2;
            mark.position.set(i * laneWidth / 2, 0.02, j);
            group.add(mark);
            markings.push(mark);
        }
    }
    
    const buildings = [];
    for (let side = -1; side <= 1; side += 2) {
        const numBuildings = Math.floor(Math.random() * 3) + 2;
        for (let i = 0; i < numBuildings; i++) {
            const h = Math.random() * 15 + 5;
            const w = Math.random() * 4 + 3;
            const d = Math.random() * 4 + 3;
            const z = (Math.random() - 0.5) * segmentLength;
            const x = side * (8 + Math.random() * 5);
            
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const bMat = new THREE.MeshStandardMaterial({ color: theme.building, roughness: 0.7 });
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(x, h/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            group.add(building);
            
            if (Math.random() > 0.3) {
                const sGeo = new THREE.PlaneGeometry(w * 0.6, h * 0.4);
                const sMat = new THREE.MeshStandardMaterial({ 
                    color: theme.emissive, emissive: theme.emissive, emissiveIntensity: 3 
                });
                const sign = new THREE.Mesh(sGeo, sMat);
                sign.position.set(x + (side > 0 ? -w/2 - 0.1 : w/2 + 0.1), h * 0.6, z);
                sign.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
                group.add(sign);
                buildings.push({ mesh: building, sign });
            } else {
                buildings.push({ mesh: building, sign: null });
            }
        }
    }
    
    const obstacles = [];
    const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
    const numObstacles = Math.random() > 0.7 ? 2 : 1;
    
    for (let i = 0; i < numObstacles; i++) {
        const lane = lanes[i];
        const isHigh = Math.random() > 0.5;
        const oGeo = new THREE.BoxGeometry(2.5, isHigh ? 2.5 : 1.2, 0.5);
        const oMat = new THREE.MeshStandardMaterial({ 
            color: theme.obstacle, emissive: theme.obstacle, emissiveIntensity: 0.5 
        });
        const obs = new THREE.Mesh(oGeo, oMat);
        obs.position.set(lane * laneWidth, isHigh ? 1.25 : 0.6, (Math.random() - 0.5) * segmentLength * 0.6);
        obs.castShadow = true;
        obs.receiveShadow = true;
        group.add(obs);
        obstacles.push({ mesh: obs, isHigh, lane });
    }
    
    const coins = [];
    [-1, 0, 1].forEach(lane => {
        if (!obstacles.find(o => o.lane === lane)) {
            const cGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const cMat = new THREE.MeshStandardMaterial({ 
                color: theme.coin, emissive: theme.coin, emissiveIntensity: 1, metalness: 0.8, roughness: 0.2 
            });
            const coin = new THREE.Mesh(cGeo, cMat);
            coin.rotation.x = Math.PI / 2;
            coin.rotation.z = Math.PI / 2;
            coin.position.set(lane * laneWidth, 1.0, (Math.random() - 0.5) * segmentLength * 0.6);
            group.add(coin);
            coins.push({ mesh: coin, collected: false });
        }
    });
    
    scene.add(group);
    return { group, road, markings, buildings, obstacles, coins, z: zPos };
}

function initWorld() {
    state.segments.forEach(s => scene.remove(s.group));
    state.segments = [];
    state.lastSegmentZ = 0;
    
    for (let i = 0; i < numSegments; i++) {
        const seg = createSegment(-i * segmentLength);
        state.segments.push(seg);
        state.lastSegmentZ = seg.z;
    }
}

function updateWorld() {
    if (!player) return;
    
    const playerZ = player.position.z;
    
    state.segments.forEach(seg => {
        if (seg.z > playerZ + 30) {
            scene.remove(seg.group);
            const newZ = state.lastSegmentZ - segmentLength;
            const newSeg = createSegment(newZ);
            state.lastSegmentZ = newZ;
            
            const index = state.segments.indexOf(seg);
            state.segments[index] = newSeg;
        }
    });
}

function checkCollisions() {
    if (!player) return;
    
    const pBox = new THREE.Box3().setFromObject(player);
    pBox.expandByScalar(-0.2);
    
    state.segments.forEach(seg => {
        seg.obstacles.forEach(obs => {
            const oBox = new THREE.Box3().setFromObject(obs.mesh);
            if (pBox.intersectsBox(oBox)) {
                gameOver();
            }
        });
        
        seg.coins.forEach(coin => {
            if (!coin.collected) {
                const cBox = new THREE.Box3().setFromObject(coin.mesh);
                if (pBox.intersectsBox(cBox)) {
                    coin.collected = true;
                    coin.mesh.visible = false;
                    state.coins++;
                    state.score += 50;
                    updateHUD();
                }
            }
        });
    });
}

function spawnParticles(pos) {
    const theme = THEMES[state.theme];
    const count = 30;
    const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const mat = new THREE.MeshBasicMaterial({ color: theme.particle });
    
    for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.position.x += (Math.random() - 0.5) * 1.5;
        mesh.position.y += (Math.random() - 0.5) * 1.5;
        mesh.position.z += (Math.random() - 0.5) * 1.5;
        mesh.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 0.6,
            Math.random() * 0.6 + 0.3,
            (Math.random() - 0.5) * 0.6
        );
        mesh.userData.life = 1.0;
        scene.add(mesh);
        state.particles.push(mesh);
    }
}

function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.userData.velocity.y -= 0.025;
        p.position.add(p.userData.velocity);
        p.userData.life -= dt * 1.5;
        p.scale.setScalar(Math.max(0, p.userData.life));
        p.rotation.x += dt * 2;
        p.rotation.y += dt * 2;
        
        if (p.userData.life <= 0) {
            scene.remove(p);
            state.particles.splice(i, 1);
        }
    }
}

function updatePlayer(dt) {
    if (!player) return;
    
    if (state.isPlaying) {
        state.speed = Math.min(state.maxSpeed, state.speed + 0.0001);
        player.position.z -= state.speed;
        state.distance += state.speed;
        state.score = Math.floor(state.distance * 10 + state.coins * 50);
        
        player.position.x += (state.targetX - player.position.x) * 10 * dt;
        player.rotation.z = (state.targetX - player.position.x) * -0.1;
        
        if (state.isJumping) {
            state.velocityY -= 0.015;
            player.position.y += state.velocityY;
            if (player.position.y <= state.playerBaseY) {
                player.position.y = state.playerBaseY;
                state.isJumping = false;
                state.velocityY = 0;
            }
        }
        
        if (mixer) mixer.update(dt);
        
        state.segments.forEach(seg => {
            seg.coins.forEach(c => {
                if (!c.collected) c.mesh.rotation.y += dt * 3;
            });
        });
    }
    
    const targetCamX = player.position.x * 0.6;
    const targetCamY = player.position.y + 4.5;
    const targetCamZ = player.position.z + 9;
    
    camera.position.x += (targetCamX - camera.position.x) * 5 * dt;
    camera.position.y += (targetCamY - camera.position.y) * 5 * dt;
    camera.position.z += (targetCamZ - camera.position.z) * 5 * dt;
    camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z - 5);
}

function updateHUD() {
    document.getElementById('score-val').textContent = state.score;
    document.getElementById('coin-val').textContent = state.coins;
    document.getElementById('speed-val').textContent = Math.floor(state.speed * 300);
}

function startGame() {
    state.isPlaying = true;
    state.isGameOver = false;
    state.score = 0;
    state.coins = 0;
    state.speed = 0.2;
    state.distance = 0;
    state.lane = 0;
    state.targetX = 0;
    state.isJumping = false;
    state.velocityY = 0;
    
    if (player) {
        player.position.set(0, state.playerBaseY, 0);
        player.rotation.y = Math.PI;
        player.rotation.z = 0;
    }
    
    initWorld();
    
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('game-over-screen').classList.remove('active');
    document.getElementById('hud').classList.add('active');
    updateHUD();
}

function gameOver() {
    state.isPlaying = false;
    state.isGameOver = true;
    if (player) spawnParticles(player.position);
    
    document.getElementById('final-score').textContent = `Счет: ${state.score}`;
    document.getElementById('game-over-screen').classList.add('active');
    document.getElementById('hud').classList.remove('active');
}

function resetGame() {
    state.particles.forEach(p => scene.remove(p));
    state.particles = [];
    startGame();
}

function changeLane(dir) {
    if (!state.isPlaying) return;
    state.lane = Math.max(-1, Math.min(1, state.lane + dir));
    state.targetX = state.lane * laneWidth;
}

function jump() {
    if (!state.isPlaying || state.isJumping) return;
    state.isJumping = true;
    state.velocityY = 0.35;
}

function setupInputs() {
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            e.preventDefault();
            if (!state.isPlaying && !state.isGameOver) startGame();
            else if (state.isGameOver) resetGame();
            else jump();
        }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
        if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
    });
    
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: false});
    
    window.addEventListener('touchend', (e) => {
        e.preventDefault();
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;
        
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30) {
            if (!state.isPlaying && !state.isGameOver) startGame();
            else if (state.isGameOver) resetGame();
            return;
        }
        
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 30) changeLane(1);
            else if (dx < -30) changeLane(-1);
        } else {
            if (dy < -30) jump();
        }
    }, {passive: false});
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    
    updatePlayer(dt);
    if (state.isPlaying) {
        updateWorld();
        checkCollisions();
        updateHUD();
    }
    updateParticles(dt);
    
    renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
